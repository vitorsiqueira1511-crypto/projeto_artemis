<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Artemis - Rumo à Lua</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; text-align: center; background-color: #0b3d91; color: white; }
        .container { width: 80%; margin: auto; padding: 20px; }
        img.logo { width: 200px; margin-top: 20px; }
        .galeria img { width: 250px; height: 180px; margin: 10px; border: 2px solid white; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://www.nasa.gov/wp-content/uploads/2019/07/artemis_logo.png" alt="Logotipo Artemis" class="logo">
        
        <h1>Missão Artemis</h1>
        
        <p>A Missão Artemis é o novo capítulo da exploração lunar da NASA. O objetivo principal é levar a primeira mulher e a primeira pessoa de cor à superfície da Lua, estabelecendo uma presença sustentável para futuramente enviar astronautas a Marte.</p>

        <h2>Galeria da Missão</h2>
        <div class="galeria">
            <img src="https://images-assets.nasa.gov/image/NHQ202211160001/NHQ202211160001~thumb.jpg" alt="Artemis I Lançamento">
            <img src="https://images-assets.nasa.gov/image/hSF-NASA-Artemis-Crew/hSF-NASA-Artemis-Crew~thumb.jpg" alt="Tripulação Artemis II">
            <img src="https://images-assets.nasa.gov/image/as11-40-5874/as11-40-5874~thumb.jpg" alt="Pegada na Lua">
            <img src="https://images-assets.nasa.gov/image/GSFC_20171208_Archive_e000494/GSFC_20171208_Archive_e000494~thumb.jpg" alt="Foguete SLS">
            <img src="https://images-assets.nasa.gov/image/iss068e023190/iss068e023190~thumb.jpg" alt="Orion orbitando a Lua">
        </div>
    </div>
</body>
</html>
