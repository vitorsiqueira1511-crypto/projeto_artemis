<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Artemis - NASA</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #05070a; /* Fundo Preto Espacial */
            color: #e0e0e0;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
        }
        h1 {
            color: #d4af37; /* Dourado */
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #bbb;
        }
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .card {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
        }
        .card:hover {
            border-color: #d4af37;
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .card-info {
            padding: 15px;
            font-weight: bold;
            color: #fff;
        }
        footer {
            margin-top: 50px;
            padding: 20px;
            font-size: 0.9rem;
            color: #555;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Missão Artemis</h1>
        <p>Explorando a Lua para chegar a Marte. A NASA está levando a humanidade de volta ao solo lunar.</p>

        <div class="galeria">
            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Artemis_I_Space_Launch_System_at_Launch_Pad_39B.jpg/800px-Artemis_I_Space_Launch_System_at_Launch_Pad_39B.jpg" alt="Foguete SLS">
                <div class="card-info">Foguete SLS na Plataforma</div>
            </div>

            <div class="card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Artemis_II_Crew_Portrait.jpg/800px-Artemis_II_Crew_Portrait.jpg" alt="Tripulação">
                <div class="card-info">Tripulação Artemis II</div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1614728263952-84ea256f9679?auto=format&fit=crop&w=800&q=80" alt="Superfície Lunar">
                <div class="card-info">Exploração da Superfície</div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=800&q=80" alt="Espaço">
                <div class="card-info">A Caminho de Marte</div>
            </div>
        </div>
    </div>

    <footer>
        Projeto Artemis - Desenvolvido por Vitor Siqueira &copy; 2026
    </footer>

</body>
</html>
